    <h2>Contact Me Form</h2>

    <p>

        Please fill out the form below if you would like

        to send me information, feedback, or an inquiry.

    </p>

    <form>

        <!-- Full Name -->

        <label for="fullname">Full Name:</label><br>

        <input type="text" id="fullname" name="fullname">

        <br><br>

        <!-- Email -->

        <label for="email">Email Address:</label><br>

        <input type="email" id="email" name="email">

        <br><br>

        <!-- Gender -->

        <label>Gender:</label><br>

        <input type="radio"

               id="male"

               name="gender"

               value="Male">

        <label for="male">Male</label>

        <input type="radio"

               id="female"

               name="gender"

               value="Female">

        <label for="female">Female</label>

        <br><br>

        <!-- Interests -->

        <label>Interests:</label><br>

        <input type="checkbox"

               id="technology"

               name="interests"

               value="Technology">

        <label for="technology">Technology</label>

        <br>

        <input type="checkbox"

               id="gaming"

               name="interests"

               value="Gaming">

        <label for="gaming">Gaming</label>

        <br>

        <input type="checkbox"

               id="music"

               name="interests"

               value="Music">

        <label for="music">Music</label>

        <br>

        <input type="checkbox"

               id="cooking"

               name="interests"

               value="Cooking">

        <label for="cooking">Cooking</label>

        <br><br>

        <!-- Purpose of Visit -->

        <label for="purpose">Purpose of Visit:</label><br>

        <select id="purpose" name="purpose">

            <option value="General Inquiry">General Inquiry</option>

            <option value="Feedback">Feedback</option>

            <option value="Collaboration">Collaboration</option>

            <option value="School Project">School Project</option>

        </select>

        <br><br>

        <!-- Message -->

        <label for="message">Message:</label><br>

        <textarea

            id="message"

            name="message"

            rows="5"

            cols="40"></textarea>

        <br><br>

        <!-- Buttons -->

        <input type="submit" value="Send Message">

        <input type="reset" value="Clear Form">

    </form>

    <hr>

    <p>

        <a href="index.html">← Return to Home</a>

    </p>

</body>

</html>
